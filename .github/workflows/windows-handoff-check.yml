name: Windows observation checks
on:
  push:
    branches: [feat/clearhouse-portal-v1]
    paths:
      - clara/windows_activity.py
      - tests/test_windows_activity_native.py
      - Test-ClaraWorker.ps1
      - Start-Clara.ps1
      - Run-ClaraAutomatic.ps1
      - Set-ClaraAutostart.ps1
      - Connect-ClaraPortal.ps1
      - Update-ClaraPortalTest.ps1
      - scripts/Portal-Credential.ps1
      - tests/windows_portal_setup.ps1
      - tests/windows_portal_update.ps1
      - .github/workflows/windows-handoff-check.yml
      - requirements.lock
      - pyproject.toml
      - scripts/verify-portable.py
      - clara/portal_contract.py
      - clara/contracts/portal-v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-installation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Verify the installed core and portal contract without live access
        run: python scripts/verify-portable.py core
  native-observations:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.2.2 pywin32==312 pytest==8.4.2
      - run: python -m pytest tests/test_windows_activity_native.py -q
      - name: Check encrypted worker connection and startup
        shell: powershell
        run: .\tests\windows_portal_setup.ps1
      - name: Parse automatic startup scripts with Windows PowerShell
        shell: powershell
        run: |
          foreach ($ClaraFile in @('Run-ClaraAutomatic.ps1', 'Set-ClaraAutostart.ps1')) {
            $ClaraTokens = $null; $ClaraErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $ClaraFile), [ref]$ClaraTokens, [ref]$ClaraErrors)
            if ($ClaraErrors.Count) { throw ($ClaraErrors | Out-String) }
          }
      - name: Check the pinned integration updater
        shell: powershell
        run: .\tests\windows_portal_update.ps1
      - name: Check the read-only PowerShell diagnostic
        shell: powershell
        run: |
          $ClaraTestFolder = Join-Path $env:RUNNER_TEMP ('clara-probe-' + [guid]::NewGuid().ToString('N'))
          python -m venv --system-site-packages (Join-Path $ClaraTestFolder '.windows-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the diagnostic test environment.' }
          $ClaraLines = & .\Test-ClaraWorker.ps1 -ApplicationFolder $ClaraTestFolder -ProbePath (Join-Path $PWD 'clara\windows_activity.py') 6>&1
          $ClaraReportLine = @($ClaraLines | ForEach-Object { "$_" } | Where-Object { $_.StartsWith('Report: ') })
          if ($ClaraReportLine.Count -ne 1) { throw 'Diagnostic did not produce exactly one report.' }
          $ClaraReportPath = $ClaraReportLine[0].Substring(8)
          $ClaraReport = Get-Content -LiteralPath $ClaraReportPath -Raw | ConvertFrom-Json
          if ($null -eq $ClaraReport.interactive -or $null -eq $ClaraReport.processes -or $null -eq $ClaraReport.print_jobs) {
            throw 'Diagnostic report is incomplete.'
          }
          Remove-Item -LiteralPath $ClaraReportPath
          Write-Host 'Windows PowerShell diagnostic produced a valid report.'
